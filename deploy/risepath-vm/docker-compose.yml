# Rise Path dedicated VM stack (db + api + mcp; kokoro-tts with profile tts; cloudflared with profile
# tunnel). Default COMPOSE_PROFILES=tts (stack.env.example). Hermes (profile full) is not offered to
# learners; it stays for self-hosting and development (deploy-stack.sh runs
# scripts/init-hermes-profile.sh before up when full is listed).
#
#   cp stack.env.example stack.env && chmod 600 stack.env
#   cp tunnel.env.example tunnel.env && chmod 600 tunnel.env   # only for COMPOSE_PROFILES=tts,tunnel
#   ./scripts/deploy-stack.sh   # build -> up --wait db -> run --rm --no-deps api npm run db:migrate -> up -d
#   (apply migrations before the new api starts: its healthcheck fails while one is pending)

name: risepath

services:
  db:
    # Postgres 16 with pgvector. On a new, empty pgdata volume migration 000 creates the vector
    # extension, so material_chunks.embedding is vector(768) with an HNSW index (RAG vector search).
    # Changing the image does not convert a volume made by an earlier image. Bump tag and digest together.
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: on first boot the image's init server listens only on the socket; TCP means the real server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Tailscale peers reach 100.x:5432. Do NOT open this port in GCP VPC firewall.
      - "5432:5432"

  api:
    build:
      context: ../..
      dockerfile: deploy/risepath-vm/Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - path: stack.env
        required: false
    environment:
      DATABASE_URL_PHASE1: ${DATABASE_URL_PHASE1}
      PORT: ${PORT:-3006}
      NODE_ENV: ${NODE_ENV:-production}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      HERMES_API_URL: ${HERMES_API_URL:-http://hermes:8642}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      # Gemini only when GEMINI_ALLOWED is exactly "true" (off by default: under-18 clause in the
      # Gemini API terms; stack.env.example).
      GEMINI_ALLOWED: ${GEMINI_ALLOWED:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Minor safeguards (Phase 0.5; stack.env.example). Empty = the safe defaults: no guest AI,
      # pause after 10 blocked inputs a day, alerts to AI_CAP_ALERT_WEBHOOK_URL. The dev audience is
      # ignored in production (the api warns when it is set).
      LLM_GUEST_AI: ${LLM_GUEST_AI:-}
      SAFETY_BLOCKS_BEFORE_PAUSE: ${SAFETY_BLOCKS_BEFORE_PAUSE:-}
      SAFETY_ALERT_WEBHOOK_URL: ${SAFETY_ALERT_WEBHOOK_URL:-}
      AI_ACCESS_DEV_AUDIENCE: ${AI_ACCESS_DEV_AUDIENCE:-}
      KOKORO_TTS_URL: ${KOKORO_TTS_URL:-http://kokoro-tts:8880}
      KOKORO_TTS_DEFAULT_VOICE_JA: ${KOKORO_TTS_DEFAULT_VOICE_JA:-jf_alpha}
      KOKORO_TTS_DEFAULT_VOICE_EN: ${KOKORO_TTS_DEFAULT_VOICE_EN:-af_bella}
      MEMANTO_ENABLED: ${MEMANTO_ENABLED:-false}
      MEMANTO_API_URL: ${MEMANTO_API_URL:-http://memanto:8000}
      MEMANTO_SECRET_KEY: ${MEMANTO_SECRET_KEY:-}
      MEMANTO_SESSION_DURATION_HOURS: ${MEMANTO_SESSION_DURATION_HOURS:-24}
      MEMANTO_RECALL_LIMIT: ${MEMANTO_RECALL_LIMIT:-8}
      MEMANTO_MIN_CONFIDENCE_WRITE: ${MEMANTO_MIN_CONFIDENCE_WRITE:-0.7}
    # default: db, mcp, hermes, kokoro-tts. edge: cloudflared only (api.<domain> → api:3006).
    networks:
      - default
      - edge
    ports:
      # Tailscale peers reach 100.x:3006. Once ORIGIN_SECRET is set they must send the
      # x-origin-secret header and then count as edge requests (no bridge-token auth).
      - "3006:3006"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3006/api/v2/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  kokoro-tts:
    profiles:
      - tts
      - full
    build:
      context: ../kokoro-tts
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8880:8880"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mcp:
    build:
      context: ../..
      dockerfile: deploy/risepath-vm/Dockerfile
      target: mcp
    restart: unless-stopped
    env_file:
      - path: stack.env
        required: false
    environment:
      DATABASE_URL_PHASE1: ${DATABASE_URL_PHASE1}
      NODE_ENV: ${NODE_ENV:-production}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MCP_SSE_PORT: ${MCP_SSE_PORT:-3100}
      RISE_PATH_MCP_PROFILE: ${RISE_PATH_MCP_PROFILE:-admin}
      PHASE1_USER_ID: ${PHASE1_USER_ID:-00000000-0000-0000-0000-000000000001}
      RISE_PATH_BRIDGE_TOKEN: ${RISE_PATH_BRIDGE_TOKEN:-}
      KOKORO_TTS_URL: ${KOKORO_TTS_URL:-http://kokoro-tts:8880}
      KOKORO_TTS_DEFAULT_VOICE_JA: ${KOKORO_TTS_DEFAULT_VOICE_JA:-jf_alpha}
      KOKORO_TTS_DEFAULT_VOICE_EN: ${KOKORO_TTS_DEFAULT_VOICE_EN:-af_bella}
      MEMANTO_ENABLED: ${MEMANTO_ENABLED:-false}
      MEMANTO_API_URL: ${MEMANTO_API_URL:-http://memanto:8000}
      MEMANTO_SECRET_KEY: ${MEMANTO_SECRET_KEY:-}
      MEMANTO_SESSION_DURATION_HOURS: ${MEMANTO_SESSION_DURATION_HOURS:-24}
      MEMANTO_RECALL_LIMIT: ${MEMANTO_RECALL_LIMIT:-8}
      MEMANTO_MIN_CONFIDENCE_WRITE: ${MEMANTO_MIN_CONFIDENCE_WRITE:-0.7}
    ports:
      - "3100:3100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    profiles:
      - full
    volumes:
      - ./hermes-data:/opt/data
      - ../../skills:/opt/risepath/skills:ro
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: ${API_SERVER_PORT:-8642}
      API_SERVER_KEY: ${HERMES_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DATABASE_URL_PHASE1: ${DATABASE_URL_PHASE1}
      RISE_PATH_BRIDGE_TOKEN: ${RISE_PATH_BRIDGE_TOKEN:-}
    ports:
      - "${API_SERVER_PORT:-8642}:8642"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8642/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 90s
    depends_on:
      mcp:
        condition: service_healthy
    command: ["gateway", "run"]

  # Public edge: Cloudflare Tunnel (remotely managed) publishes https://api.<domain> → http://api:3006.
  # Outbound only (TCP/UDP 7844), no published ports. Reads TUNNEL_TOKEN from tunnel.env and never
  # stack.env, so this container holds no API or DB keys. The image is distroless (no shell).
  # Bump tag and digest together, in a quiet window: a restart drops in-flight streams.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    restart: unless-stopped
    profiles:
      - tunnel
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    env_file:
      - path: tunnel.env
        required: false
    networks:
      - edge
    healthcheck:
      test: ["CMD", "/usr/local/bin/cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

networks:
  # Plain bridge shared by api and cloudflared only; cloudflared keeps its outbound egress.
  edge: {}

volumes:
  pgdata: